notes:
- 'weight_bytes_by_role and param_count are the Q8_0 GGUF''s own tensor sizes (gguf-py,
  2026-10-12): *_exps = routed_experts, token_embd = embedding, output = lm_head, the
  rest (incl. shared experts, norms, F32 KDA tensors) = other. They were copied from
  the FP8 safetensors checkpoint before (routed 47.17 GB, bf16 lm_head 0.755 GB), which
  put the batch-1 decode expectation at 3.50 GB instead of 3.35 GB.'
- custom modelling code present -- trust_remote_code enabled automatically
- Multi-head latent attention (kv_lora_rank 512, rope 64). config head_dim=72 does
  not apply to it. This GGUF splits kv_b_proj into attn_k_b/attn_v_b, so llama.cpp
  caches the latent (K only, f16, 576 values per token per MLA layer = 8,064 B/token),
  not the expanded per-head K/V transformers holds (143,360 B/token); the analysis
  sizes it that way for the llamacpp backend (checked against llama.cpp's allocation
  log, 2026-10-12).
- 'Hybrid attention: 20 linear-attention layers with a fixed-size recurrent state,
  7 full-attention layers with a growing cache.'
- 'Mixture of experts: 256 experts per layer, 8 routed per token plus 1 shared (3.5%
  of expert weights active). A decode step reads roughly 3.35 GB of the 52.2 GB checkpoint,
  so decode traffic is compared against the active figure -- against the full checkpoint
  it would read as an order of magnitude too low.'

notes:
- GGUF copy of configs/models/qwen3-0.6b.yaml for the llamacpp backend (docs/09). Converted
  from the same safetensors with llama.cpp's convert_hf_to_gguf.py --outtype bf16 at llama.cpp
  commit 0c1e57098bba43ac29e6e3b677cdceebdd22334f. Every architecture field is copied unchanged.
- tokenizer_path points at the original Hugging Face snapshot so the synthetic prompt uses
  the same vocabulary bound, and therefore the same token ids, as the hf backend.
- The GGUF stores both token_embd.weight and output.weight (311 MB each), so llama.cpp holds
  about 1.50 GB resident, not 1.19 GB. A decode step's reads are unchanged (all of the output
  matrix plus one embedding row).
- This checkpoint declares tied word embeddings and stores lm_head.weight anyway,
  so the on-disk size counts the embedding matrix twice. The loaded model holds one
  copy, so its resident size reads about 311 MB below the on-disk figure. That is
  expected, not a discrepancy -- and the resident figure is the one a decode step's
  traffic must be compared against, since the step reads that matrix once.
stores_lm_head: true

# Quick: a small tier-2 deep dive (top 5 kernels, ranked from the nsys timeline), no
# calibration sweep.
#
# For iterating on a setup or checking that a new checkpoint loads and profiles at all.
# Tier 1 is off: it costs roughly one minute of ncu per 100 kernels in scope, which is hours
# on an eager MoE. For a tier-1-only run, as this profile used to be, set tiers: [1] or pass
# --tiers 1.
baseline: true
nsys:
  enabled: true
  trace: cuda,nvtx,osrt
  cuda_memory_usage: true
  cuda_um_cpu_page_faults: false
  cuda_um_gpu_page_faults: false
  gpu_metrics: true
  gpu_metrics_frequency: 10000
  cuda_graph_trace: node
  capture_range: cudaProfilerApi
  capture_range_end: stop
  timeout_s: 1800
ncu:
  enabled: true
  tiers: [2]            # [1] = tier 1 only (byte totals, no deep dive)
  rank_source: nsys     # or tier1: rank from tier 1's own export (needs 1 in tiers)
  top_n_kernels: 5
  nvtx_scope: nsbench.decode_step
  clock_control: base
  cache_control: all
  replay_mode: kernel
  max_kernels: 4000
  timeout_s: 5400

# Standard: the default. Full sections on the heaviest few kernels, ranked from the nsys
# timeline. Tier 1 (the per-level byte totals and the decode physics check) is off because it
# takes hours on an eager MoE; set tiers: [1, 2] or pass --tiers 1,2 to turn it back on.
baseline: true
nsys:
  enabled: true
  trace: cuda,nvtx,cublas,cudnn,osrt
  cuda_memory_usage: true
  cuda_um_cpu_page_faults: true
  cuda_um_gpu_page_faults: true
  gpu_metrics: true
  gpu_metrics_frequency: 10000
  cuda_graph_trace: node
  capture_range: cudaProfilerApi
  capture_range_end: stop
  timeout_s: 3600
ncu:
  enabled: true
  tiers: [2]            # [1, 2] = tier 1 back on
  rank_source: nsys     # or tier1: rank from tier 1's own export (needs 1 in tiers)
  top_n_kernels: 8
  nvtx_scope: nsbench.decode_step
  clock_control: base
  cache_control: all
  replay_mode: kernel
  max_kernels: 4000
  timeout_s: 7200

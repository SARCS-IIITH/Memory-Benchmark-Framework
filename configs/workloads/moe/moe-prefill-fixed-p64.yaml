# MoE short prefill: routing=fixed -- every token forced to experts 0-7 in every layer (best case, fewest bytes).
# Routing is applied by nsight_bench/compat/routing.py; see docs/07-moe-routing.md.
name: moe-prefill-fixed-p64
kind: text-generation
prompt_tokens: 64
generate_tokens: 4
batch_size: 1
warmup_iters: 2
repeat: 3
prompt_source: synthetic
do_sample: false
seed: 1234
annotate_layers: false
routing: fixed
